name: Node runtime security
on:
  push:
    paths: [Dockerfile.node-runtime, .github/workflows/node-runtime-security.yml]
  pull_request:
    paths: [Dockerfile.node-runtime, .github/workflows/node-runtime-security.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build preserved runtime and prove binary dependencies
        run: |
          docker build -f Dockerfile.node-runtime --build-arg BASE_IMAGE=node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205 --build-arg NODE_RUNTIME_RECIPE_REVISION="$GITHUB_SHA" -t node-runtime-security .
          docker run --rm --network none --read-only --cap-drop ALL --entrypoint node node-runtime-security -e 'const assert = require("node:assert/strict"); const z = require("node:zlib"); assert.equal(process.version, "v24.22.1"); assert.equal(z.brotliDecompressSync(z.brotliCompressSync(Buffer.from("runtime-security-smoke"))).toString(), "runtime-security-smoke"); assert.equal(require("node:tls").checkServerIdentity("example.com", {subjectaltname:"DNS:example.com"}), undefined); console.log(JSON.stringify({version:process.version, openssl:process.versions.openssl, brotli:process.versions.brotli}));'
